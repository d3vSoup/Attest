<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Attest — AI Payment Intelligence</title>
  <meta name="description" content="Every payment recovered. Every risk stopped. Every question answered. AI-powered merchant intelligence for Razorpay."/>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    /* ── Kinetic design tokens ─────────────────────────────────────────────── */
    :root {
      --bg: #f1f1ee; --paper: #ffffff; --border: #d2d2cc; --border2: #c0c0ba;
      --ink: #0a0a0a; --muted: #6c6c68; --subtle: #9c9c96;
      --accent: #0a2fff; --accent2: #3b5bff; --accent-bg: #eef2ff; --accent-bd: #b4c4ff;
      --hot: #ff3b1f; --on-hot: #ffffff; --hot-bg: #fff1ee; --hot-bd: #ffb8ad;
      --green: #15803d; --green-bg: #f0fdf4; --green-bd: #86efac;
      --red: #b91c1c; --red-bg: #fef2f2; --red-bd: #fca5a5;
      --amber: #b45309; --amber-bg: #fffbeb; --amber-bd: #fcd34d;
      --orange: #c2410c; --orange-bg: #fff7ed; --orange-bd: #fdba74;
      --shadow-hard: 4px 4px 0 var(--ink);
      --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
    }
    html { font-size: 14px; -webkit-font-smoothing: antialiased; }
    body {
      background: var(--bg); color: var(--ink);
      font-family: 'Inter', sans-serif; height: 100vh; overflow: hidden;
      cursor: none;
    }
    /* Dot grid background */
    body::before {
      content: '';
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background-image: radial-gradient(circle, rgba(10,10,10,0.09) 1px, transparent 1px);
      background-size: 24px 24px;
    }
    /* Custom cursor */
    #k-cursor-dot {
      position: fixed; width: 7px; height: 7px;
      background: var(--ink); pointer-events: none; z-index: 9999;
      transform: translate(-50%,-50%); border-radius: 0 !important;
      transition: width 0.2s var(--ease-out), height 0.2s var(--ease-out), background 0.2s;
    }
    #k-cursor-ring {
      position: fixed; width: 32px; height: 32px;
      border: 1.5px solid var(--ink); pointer-events: none; z-index: 9998;
      transform: translate(-50%,-50%); border-radius: 0 !important;
      transition: width 0.3s var(--ease-out), height 0.3s var(--ease-out), border-color 0.2s;
      opacity: 0.35;
    }
    body.k-hover #k-cursor-dot { width: 11px; height: 11px; background: var(--hot); }
    body.k-hover #k-cursor-ring { width: 52px; height: 52px; border-color: var(--hot); opacity: 0.2; }
    .serif { font-family: 'IBM Plex Mono', monospace; }
    .mono  { font-family: 'IBM Plex Mono', monospace; }
    ::-webkit-scrollbar { width: 3px; height: 3px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border2); }

    /* ─── Shell ─────────────────────────────────────────────────────────── */
    .shell { display: flex; flex-direction: column; height: 100vh; position: relative; z-index: 1; }
    .header {
      height: 52px; padding: 0 1.5rem; border-bottom: 2px solid var(--ink);
      display: flex; align-items: center; justify-content: space-between;
      background: rgb(255 255 255 / 0.92);
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      flex-shrink: 0; z-index: 10;
    }
    .workspace { display: flex; flex: 1; min-height: 0; }
    .footer {
      height: 26px; padding: 0 1.5rem; border-top: 2px solid var(--ink);
      background: var(--paper); display: flex; align-items: center;
      justify-content: space-between; flex-shrink: 0;
      font-family: 'IBM Plex Mono', monospace; font-size: 0.6rem; color: var(--subtle);
      text-transform: uppercase; letter-spacing: 0.08em;
    }

    /* ─── Events panel ──────────────────────────────────────────────────── */
    .events-panel {
      width: 268px; border-right: 2px solid var(--ink);
      background: var(--paper); display: flex; flex-direction: column; flex-shrink: 0;
    }
    .events-header {
      padding: 0.75rem 1rem 0.5rem; border-bottom: 2px solid var(--ink);
      display: flex; align-items: center; justify-content: space-between;
    }
    .events-title { font-size: 0.6rem; font-family: 'IBM Plex Mono', monospace; font-weight: 700; letter-spacing: 0.13em; text-transform: uppercase; color: var(--muted); }
    .events-list { flex: 1; overflow-y: auto; padding: 0.35rem 0; }
    .event-item {
      padding: 0.6rem 1rem; cursor: pointer;
      border-left: 3px solid transparent; display: flex; gap: 0.6rem; align-items: flex-start;
      transition: background 0.18s var(--ease-out), border-color 0.18s var(--ease-out), transform 0.18s var(--ease-out);
    }
    .event-item:hover { background: var(--bg); transform: translateX(2px); }
    .event-item.active { background: var(--hot-bg); border-left-color: var(--hot); }
    .event-dot { width: 7px; height: 7px; flex-shrink: 0; margin-top: 0.3rem; }
    .dot-red    { background: #EF4444; }
    .dot-amber  { background: #F59E0B; }
    .dot-orange { background: #F97316; }
    .dot-blue   { background: var(--accent2); }
    .dot-green  { background: #22C55E; }
    .event-body { flex: 1; min-width: 0; }
    .event-title { font-size: 0.78rem; font-weight: 600; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: color 0.15s; }
    .event-item:hover .event-title { color: var(--hot); }
    .event-meta  { font-size: 0.68rem; color: var(--muted); margin-top: 0.1rem; }
    .event-time  { font-size: 0.6rem; font-family: 'IBM Plex Mono', monospace; color: var(--subtle); margin-top: 0.2rem; }
    .event-section-label { font-size: 0.58rem; font-weight: 700; letter-spacing: 0.13em; text-transform: uppercase; color: var(--subtle); padding: 0.65rem 1rem 0.2rem; }

    /* ─── Chat panel ─────────────────────────────────────────────────────── */
    .chat-panel { flex: 1; display: flex; flex-direction: column; background: var(--bg); min-width: 0; }
    .chat-context-bar {
      padding: 0.5rem 1.25rem; border-bottom: 2px solid var(--ink);
      background: var(--paper); display: flex; align-items: center; gap: 0.75rem;
      flex-shrink: 0; min-height: 42px;
    }
    .chat-messages { flex: 1; overflow-y: auto; padding: 1.25rem 1.5rem; display: flex; flex-direction: column; gap: 1rem; }
    .chat-input-bar {
      border-top: 2px solid var(--ink); background: var(--paper);
      padding: 0.6rem 1.25rem; display: flex; gap: 0.5rem; align-items: center;
      flex-shrink: 0;
    }
    .chat-field {
      flex: 1; border: 2px solid var(--border);
      padding: 0.5rem 0.75rem; font-family: 'Inter', sans-serif; font-size: 0.8rem;
      outline: none; background: var(--bg); color: var(--ink); resize: none;
      line-height: 1.4; max-height: 80px; overflow-y: auto;
      transition: border-color 0.2s var(--ease-out), background 0.2s;
    }
    .chat-field:focus { border-color: var(--hot); background: var(--paper); }
    /* Kinetic sliding-fill send button */
    .send-btn {
      position: relative; overflow: hidden;
      background: var(--ink); color: #fff; border: 2px solid var(--ink);
      padding: 0.5rem 0.9rem; font-size: 0.68rem; font-weight: 700;
      cursor: pointer; font-family: 'IBM Plex Mono', monospace; text-transform: uppercase;
      letter-spacing: 0.1em; flex-shrink: 0;
      transition: color 0.3s; display: inline-flex; align-items: center; gap: 0.3rem;
    }
    .send-btn::before {
      content: ''; position: absolute; inset: 0;
      background: var(--hot); transform: translateX(-101%);
      transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .send-btn:hover { color: var(--on-hot); }
    .send-btn:hover::before { transform: translateX(0); }
    .send-btn span { position: relative; z-index: 1; }
    .send-btn:disabled { opacity: 0.35; cursor: not-allowed; }
    .send-btn:disabled::before { display: none; }


    /* ─── Messages ──────────────────────────────────────────────────────── */
    .msg-row { display: flex; align-items: flex-start; gap: 0.6rem; max-width: 720px; }
    .msg-row.user { flex-direction: row-reverse; margin-left: auto; }
    .msg-avatar {
      width: 26px; height: 26px; border-radius: 3px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.65rem; font-weight: 700; letter-spacing: 0.03em;
    }
    .avatar-agent { background: var(--ink); color: #fff; }
    .avatar-user  { background: #E5E5E3; color: var(--muted); }
    .msg-content { flex: 1; min-width: 0; }
    .msg-sender { font-size: 0.6rem; font-weight: 600; letter-spacing: 0.07em; text-transform: uppercase; color: var(--subtle); margin-bottom: 0.25rem; }
    .msg-bubble {
      display: inline-block; padding: 0.6rem 0.85rem; border-radius: 2px;
      font-size: 0.8rem; line-height: 1.6; max-width: 100%;
    }
    .bubble-agent { background: var(--paper); border: 1px solid var(--border); color: var(--ink); }
    .bubble-user  { background: var(--ink); color: #fff; }
    .typing-dot { display: flex; gap: 3px; padding: 0.65rem 0.85rem; background: var(--paper); border: 1px solid var(--border); border-radius: 2px; }
    .typing-dot span { width: 5px; height: 5px; background: var(--border2); border-radius: 50%; animation: bounce 1.2s ease-in-out infinite; }
    .typing-dot span:nth-child(2) { animation-delay: 0.15s; }
    .typing-dot span:nth-child(3) { animation-delay: 0.3s; }
    @keyframes bounce { 0%,80%,100%{transform:translateY(0)} 40%{transform:translateY(-5px)} }

    /* ─── Inline cards ──────────────────────────────────────────────────── */
    .inline-card { margin-top: 0.6rem; border: 1px solid var(--border); border-radius: 3px; overflow: hidden; }
    .card-header { padding: 0.5rem 0.75rem; font-size: 0.62rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
    .card-body { padding: 0.75rem; }
    .card-header-recovery { background: var(--accent-bg); color: var(--accent); }
    .card-header-chargeback { background: var(--orange-bg); color: var(--orange); }
    .card-header-risk { background: var(--amber-bg); color: var(--amber); }

    .recovery-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0; border: 1px solid var(--border); border-radius: 2px; overflow: hidden; margin-bottom: 0.6rem; }
    .recovery-cell { padding: 0.5rem 0.6rem; border-right: 1px solid var(--border); }
    .recovery-cell:last-child { border-right: none; }
    .rc-val { font-family: 'IBM Plex Mono', monospace; font-size: 1.1rem; font-weight: 500; text-transform: uppercase; }
    .rc-lbl { font-size: 0.58rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-top: 0.1rem; }

    .shap-row { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.25rem; }
    .shap-label { width: 90px; font-size: 0.62rem; color: var(--muted); text-align: right; flex-shrink: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .shap-track { flex: 1; height: 6px; background: #F0F0EF; border-radius: 2px; overflow: hidden; display: flex; }
    .shap-bar { height: 100%; border-radius: 2px; transition: width 0.6s; }
    .shap-val { width: 42px; font-size: 0.62rem; font-family: 'IBM Plex Mono', monospace; text-align: right; flex-shrink: 0; }

    .letter-box { white-space: pre-wrap; font-family: 'Inter', sans-serif; font-size: 0.72rem; line-height: 1.75; color: #2D2D2C; max-height: 280px; overflow-y: auto; background: #FAFAFA; padding: 0.65rem; border-radius: 2px; border: 1px solid var(--border); }

    .signal-tag { display: inline-flex; align-items: center; font-size: 0.62rem; font-weight: 600; padding: 0.15rem 0.4rem; border: 1px solid var(--amber-bd); background: var(--amber-bg); color: var(--amber); margin: 0.15rem 0.15rem 0 0; }

    /* ─── Welcome state ─────────────────────────────────────────────────── */
    .welcome { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 2rem; text-align: center; }
    .welcome-title {
      font-family: 'IBM Plex Mono', monospace; font-size: 1.5rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.08em;
      color: var(--ink); margin-bottom: 0.6rem;
    }
    .welcome-sub { font-size: 0.82rem; color: var(--muted); line-height: 1.7; max-width: 400px; margin-bottom: 2.5rem; }
    .quick-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 2px; width: 100%; max-width: 480px; border: 2px solid var(--ink); }
    .quick-card {
      padding: 1rem 1.1rem; background: var(--paper); cursor: pointer; text-align: left;
      font-family: 'Inter', sans-serif; border-right: 2px solid var(--ink);
      position: relative; overflow: hidden;
      transition: background 0.22s var(--ease-out);
    }
    .quick-card:nth-child(even) { border-right: none; }
    .quick-card:nth-child(n+3) { border-top: 2px solid var(--ink); }
    /* Kinetic top-border accent sweep on hover */
    .quick-card::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0;
      height: 2px; background: var(--hot);
      transform: scaleX(0); transform-origin: left;
      transition: transform 0.3s var(--ease-out);
    }
    .quick-card:hover::before { transform: scaleX(1); }
    .quick-card:hover { background: var(--bg); }
    .quick-card-title { font-size: 0.8rem; font-weight: 700; color: var(--ink); font-family: 'IBM Plex Mono', monospace; text-transform: uppercase; letter-spacing: 0.06em; }
    .quick-card-sub { font-size: 0.7rem; color: var(--muted); margin-top: 0.3rem; line-height: 1.55; }

    /* ─── Audit panel ───────────────────────────────────────────────────── */
    .audit-panel {
      width: 244px; border-left: 2px solid var(--ink);
      background: var(--paper); display: flex; flex-direction: column; flex-shrink: 0;
    }
    .audit-header { padding: 0.75rem 1rem 0.5rem; border-bottom: 2px solid var(--ink); }
    .audit-title { font-size: 0.6rem; font-weight: 700; letter-spacing: 0.13em; text-transform: uppercase; color: var(--muted); font-family: 'IBM Plex Mono', monospace; }
    .audit-body { padding: 0.75rem 1rem; flex: 1; overflow-y: auto; }
    .audit-field { margin-bottom: 0.75rem; }
    .af-label { font-size: 0.58rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--subtle); margin-bottom: 0.25rem; font-family: 'IBM Plex Mono', monospace; }
    .af-value { font-family: 'IBM Plex Mono', monospace; font-size: 0.7rem; color: var(--ink); word-break: break-all; }
    .af-value.accent { color: var(--accent); }
    .af-value.red { color: var(--red); }
    .af-value.green { color: var(--green); }
    .audit-empty { color: var(--subtle); font-family: 'IBM Plex Mono', monospace; font-size: 0.68rem; line-height: 1.6; }
    .audit-shap-section { margin-top: 0.75rem; padding-top: 0.75rem; border-top: 1px solid var(--border); }

    /* ─── Shared ─────────────────────────────────────────────────────────── */
    .pill { display: inline-flex; align-items: center; font-size: 0.58rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; padding: 0.1rem 0.35rem; border: 1px solid; transition: background 0.15s, color 0.15s; }
    .pill-ok     { background: var(--green-bg); color: var(--green); border-color: var(--green-bd); }
    .pill-err    { background: var(--red-bg); color: var(--red); border-color: var(--red-bd); }
    .pill-warn   { background: var(--amber-bg); color: var(--amber); border-color: var(--amber-bd); }
    .pill-info   { background: var(--accent-bg); color: var(--accent); border-color: var(--accent-bd); }
    .pill-orange { background: var(--orange-bg); color: var(--orange); border-color: var(--orange-bd); }
    .spinner { width: 11px; height: 11px; border: 2px solid #D4D4CF; border-top-color: var(--hot); animation: spin 0.7s linear infinite; display: inline-block; flex-shrink: 0; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .pulse-dot { width: 6px; height: 6px; background: #22C55E; animation: pulse 1.8s ease-in-out infinite; display: inline-block; }
    @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.4;transform:scale(.7)} }
    @keyframes slideInRow { to { opacity: 1; transform: translateX(0); } }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }

    /* ─── Analytics Panel ─────────────────────────────────────────────────── */
    .analytics-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 100;
      display: flex; align-items: center; justify-content: center;
      animation: fadeIn 0.2s var(--ease-out);
    }
    @keyframes fadeIn { from{opacity:0} to{opacity:1} }
    .analytics-modal {
      background: var(--paper); border: 2px solid var(--ink);
      width: 92vw; max-width: 1100px; height: 86vh;
      display: flex; flex-direction: column; overflow: hidden;
      box-shadow: 8px 8px 0 var(--ink);
      animation: slideUp 0.35s var(--ease-out);
    }
    @keyframes slideUp { from{transform:translateY(20px);opacity:0} to{transform:translateY(0);opacity:1} }
    .analytics-header {
      padding: 0.9rem 1.25rem; border-bottom: 2px solid var(--ink);
      display: flex; align-items: center; justify-content: space-between; flex-shrink: 0;
    }
    .analytics-tabs {
      display: flex; gap: 0; border-bottom: 2px solid var(--ink); flex-shrink: 0;
      background: var(--bg);
    }
    .analytics-tab {
      padding: 0.6rem 1.1rem; font-size: 0.65rem; font-weight: 700; cursor: pointer;
      border-bottom: 3px solid transparent; color: var(--muted);
      transition: color 0.2s, border-color 0.2s, background 0.2s;
      letter-spacing: 0.1em; text-transform: uppercase; font-family: 'IBM Plex Mono', monospace;
      background: none; border-top: none; border-left: none; border-right: none;
    }
    .analytics-tab:hover { color: var(--ink); background: var(--paper); }
    .analytics-tab.active { border-bottom-color: var(--hot); color: var(--hot); background: var(--paper); }
    .analytics-body { flex: 1; overflow-y: auto; padding: 1.5rem 1.75rem; }
    .analytics-close {
      width: 28px; height: 28px; border: 2px solid var(--ink);
      background: none; cursor: pointer; display: flex; align-items: center; justify-content: center;
      font-size: 0.9rem; color: var(--muted);
      transition: background 0.2s var(--ease-out), color 0.2s;
    }
    .analytics-close:hover { background: var(--ink); color: var(--paper); }
    .stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0; margin-bottom: 1.5rem; border: 2px solid var(--ink); }
    .stat-card {
      padding: 0.9rem 1rem; border-right: 2px solid var(--ink);
      background: var(--paper); transition: background 0.18s var(--ease-out);
    }
    .stat-card:last-child { border-right: none; }
    .stat-card:hover { background: var(--bg); }
    .stat-card-val { font-family: 'IBM Plex Mono', monospace; font-size: 1.3rem; font-weight: 700; }
    .stat-card-lbl { font-size: 0.58rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin-top: 0.3rem; font-family: 'IBM Plex Mono', monospace; }
    .stat-card-sub { font-size: 0.62rem; color: var(--subtle); margin-top: 0.3rem; }
    .chart-wrap { border: 2px solid var(--ink); padding: 1rem; background: var(--paper); margin-bottom: 1rem; }
    .chart-title { font-size: 0.6rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin-bottom: 0.85rem; display: flex; align-items: center; justify-content: space-between; font-family: 'IBM Plex Mono', monospace; }
    .pipeline-list { display: flex; flex-direction: column; gap: 2px; }
    .pipeline-item {
      display: flex; align-items: center; gap: 0.75rem;
      padding: 0.6rem 0.85rem; border: 2px solid var(--ink);
      background: var(--paper); font-size: 0.72rem;
      transition: background 0.18s var(--ease-out), transform 0.18s var(--ease-out);
    }
    .pipeline-item:hover { background: var(--bg); transform: translateX(3px); }
    .pipeline-stage {
      display: inline-flex; align-items: center; gap: 0.25rem;
      font-size: 0.58rem; font-weight: 700; padding: 0.12rem 0.4rem;
      border: 1px solid; text-transform: uppercase; letter-spacing: 0.06em;
      flex-shrink: 0; width: 72px; justify-content: center;
    }
    .stage-anchored { background: var(--green-bg); color: var(--green); border-color: var(--green-bd); }
    .stage-batched  { background: var(--accent-bg); color: var(--accent); border-color: var(--accent-bd); }
    .stage-hashed   { background: var(--amber-bg); color: var(--amber); border-color: var(--amber-bd); }
    .stage-processed { background: #F4F4F3; color: var(--muted); border-color: var(--border2); }
    .channel-bar-row { display: flex; align-items: center; gap: 0.6rem; margin-bottom: 0.5rem; }
    .channel-bar-label { width: 70px; font-size: 0.65rem; color: var(--muted); text-align: right; flex-shrink: 0; }
    .channel-bar-track { flex: 1; height: 8px; background: var(--sunk, #e7e7e2); overflow: hidden; }
    .channel-bar-fill { height: 100%; transition: width 1s var(--ease-out); }
    .channel-bar-val { width: 50px; font-size: 0.62rem; font-family: 'IBM Plex Mono', monospace; flex-shrink: 0; }
    .loading-spinner-lg { display: flex; align-items: center; justify-content: center; height: 200px; gap: 0.5rem; color: var(--muted); font-size: 0.8rem; }
  </style>
</head>

// ── SHAP bars (CSS-based, no canvas) ──────────────────────────────────────────
function ShapBars({ factors }) {
  if (!factors || factors.length === 0) return null;
  const top = factors.slice(0, 4);
  const maxVal = Math.max(...top.map(f => Math.abs(f.impact)), 0.001);
  return (
    <div style={{ marginTop: '0.6rem' }}>
      <div style={{ fontSize: '0.58rem', fontWeight: 700, letterSpacing: '0.09em', textTransform: 'uppercase', color: 'var(--subtle)', marginBottom: '0.4rem' }}>
        Risk factors
      </div>
      {top.map((f, i) => {
        const pct = (Math.abs(f.impact) / maxVal) * 100;
        const isRisk = f.impact > 0;
        return (
          <div key={i} className="shap-row">
            <div className="shap-label">{f.feature.replace(/_/g, ' ')}</div>
            <div className="shap-track">
              {isRisk
                ? <div className="shap-bar" style={{ width: pct + '%', background: '#EF4444', marginLeft: 0 }} />
                : <div className="shap-bar" style={{ width: pct + '%', background: '#22C55E', marginLeft: 'auto' }} />
              }
            </div>
            <div className="shap-val" style={{ color: isRisk ? 'var(--red)' : 'var(--green)' }}>
              {isRisk ? '+' : ''}{f.impact.toFixed(3)}
            </div>
          </div>
        );
      })}
      <div style={{ fontSize: '0.58rem', color: 'var(--subtle)', marginTop: '0.3rem' }}>Red = increases risk · Green = reduces risk</div>
    </div>
  );
}

function useChartJs(canvasRef, buildConfig, deps) {
  useEffect(() => {
    if (!canvasRef.current || !window.Chart) return;
    const ctx = canvasRef.current.getContext('2d');
    const chart = new window.Chart(ctx, buildConfig());
    return () => chart.destroy();
  }, deps);
}

function MonteCarloFanChart({ data }) {
  const canvasRef = useRef(null);

  useEffect(() => {
    if (!canvasRef.current || !data) return;
    const canvas = canvasRef.current;
    const W = canvas.offsetWidth || 800;
    const H = canvas.offsetHeight || 300;
    canvas.width = W * window.devicePixelRatio;
    canvas.height = H * window.devicePixelRatio;
    const ctx = canvas.getContext('2d');
    ctx.scale(window.devicePixelRatio, window.devicePixelRatio);

    const PAD = { top: 18, right: 20, bottom: 36, left: 62 };
    const cW = W - PAD.left - PAD.right;
    const cH = H - PAD.top - PAD.bottom;

    // Compute y-range from all paths + bands
    const allVals = [
      ...data.p05, ...data.p95,
      ...(data.sample_paths || []).flat(),
    ].filter(Number.isFinite);
    const yMin = Math.min(...allVals) * 0.88;
    const yMax = Math.max(...allVals) * 1.05;

    const xScale = i => PAD.left + (i / (data.days.length - 1)) * cW;
    const yScale = v => PAD.top + cH - ((v - yMin) / (yMax - yMin)) * cH;

    // Clear
    ctx.clearRect(0, 0, W, H);

    // Background
    ctx.fillStyle = '#FAFAF9';
    ctx.fillRect(0, 0, W, H);

    // Subtle grid lines
    ctx.strokeStyle = 'rgba(0,0,0,0.05)';
    ctx.lineWidth = 1;
    const gridLines = 5;
    for (let i = 0; i <= gridLines; i++) {
      const y = PAD.top + (cH / gridLines) * i;
      ctx.beginPath(); ctx.moveTo(PAD.left, y); ctx.lineTo(PAD.left + cW, y); ctx.stroke();
    }

    // P5–P95 shaded fill band
    ctx.beginPath();
    data.p95.forEach((v, i) => {
      const x = xScale(i), y = yScale(v);
      i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    });
    for (let i = data.p05.length - 1; i >= 0; i--) {
      ctx.lineTo(xScale(i), yScale(data.p05[i]));
    }
    ctx.closePath();
    const grad = ctx.createLinearGradient(0, PAD.top, 0, PAD.top + cH);
    grad.addColorStop(0, 'rgba(79,70,229,0.13)');
    grad.addColorStop(1, 'rgba(239,68,68,0.07)');
    ctx.fillStyle = grad;
    ctx.fill();

    // Draw sample paths — vivid spectral rainbow
    const paths = data.sample_paths || [];
    const PALETTE = [
      '#6366F1','#8B5CF6','#A855F7','#EC4899','#EF4444',
      '#F97316','#F59E0B','#EAB308','#22C55E','#10B981',
      '#14B8A6','#06B6D4','#3B82F6','#60A5FA','#818CF8',
      '#C084FC','#E879F9','#FB7185','#FCA5A5','#FDBA74',
      '#FCD34D','#A3E635','#34D399','#2DD4BF','#38BDF8',
    ];
    paths.forEach((path, idx) => {
      const color = PALETTE[idx % PALETTE.length];
      ctx.save();
      ctx.strokeStyle = color;
      ctx.lineWidth = 1.2;
      ctx.globalAlpha = 0.52;
      ctx.shadowBlur = 0;
      ctx.beginPath();
      path.forEach((v, i) => {
        const x = xScale(i), y = yScale(v);
        i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
      });
      ctx.stroke();
      ctx.restore();
    });

    // P95 line (green dashed)
    ctx.save();
    ctx.strokeStyle = '#22C55E'; ctx.lineWidth = 2.5; ctx.setLineDash([6,3]);
    ctx.globalAlpha = 1;
    ctx.beginPath();
    data.p95.forEach((v, i) => {
      const x = xScale(i), y = yScale(v);
      i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    });
    ctx.stroke(); ctx.restore();

    // P50 line (indigo solid bold)
    ctx.save();
    ctx.strokeStyle = '#4F46E5'; ctx.lineWidth = 3; ctx.setLineDash([]);
    ctx.shadowBlur = 4; ctx.shadowColor = 'rgba(79,70,229,0.4)';
    ctx.beginPath();
    data.p50.forEach((v, i) => {
      const x = xScale(i), y = yScale(v);
      i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    });
    ctx.stroke(); ctx.restore();

    // P05 line (red dashed)
    ctx.save();
    ctx.strokeStyle = '#EF4444'; ctx.lineWidth = 2.5; ctx.setLineDash([6,3]);
    ctx.globalAlpha = 0.85;
    ctx.beginPath();
    data.p05.forEach((v, i) => {
      const x = xScale(i), y = yScale(v);
      i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    });
    ctx.stroke(); ctx.restore();

    // X axis labels (Day 1, 5, 10, 15, 20, 25, 30)
    ctx.fillStyle = '#9E9E9A'; ctx.font = '9px IBM Plex Mono'; ctx.textAlign = 'center';
    [0, 4, 9, 14, 19, 24, 29].forEach(i => {
      if (i < data.days.length) {
        ctx.fillText(`Day ${data.days[i]}`, xScale(i), H - PAD.bottom + 14);
      }
    });

    // Y axis labels
    ctx.textAlign = 'right'; ctx.font = '9px IBM Plex Mono'; ctx.fillStyle = '#9E9E9A';
    for (let i = 0; i <= gridLines; i++) {
      const v = yMin + ((yMax - yMin) / gridLines) * (gridLines - i);
      ctx.fillText(`₹${(v/1e6).toFixed(1)}M`, PAD.left - 6, PAD.top + (cH / gridLines) * i + 3);
    }

    // Legend
    const legend = [
      { color: '#22C55E', label: 'P95 (Best case)', dash: true },
      { color: '#4F46E5', label: 'P50 (Median)', dash: false },
      { color: '#EF4444', label: 'P05 (Worst case)', dash: true },
    ];
    let lx = PAD.left;
    const ly = H - 9;
    ctx.font = '9px IBM Plex Mono'; ctx.textAlign = 'left';
    legend.forEach(({ color, label, dash }) => {
      ctx.save();
      ctx.strokeStyle = color; ctx.lineWidth = 2;
      if (dash) ctx.setLineDash([4,2]); else ctx.setLineDash([]);
      ctx.beginPath(); ctx.moveTo(lx, ly - 3); ctx.lineTo(lx + 22, ly - 3); ctx.stroke();
      ctx.restore();
      ctx.fillStyle = '#6E6E6A';
      ctx.fillText(label, lx + 26, ly);
      lx += 26 + ctx.measureText(label).width + 18;
    });

    // Sample paths legend entry
    ctx.save();
    const grad2 = ctx.createLinearGradient(lx, 0, lx + 22, 0);
    grad2.addColorStop(0, '#6366F1'); grad2.addColorStop(0.5, '#F97316'); grad2.addColorStop(1, '#22C55E');
    ctx.strokeStyle = grad2; ctx.lineWidth = 2; ctx.globalAlpha = 0.7; ctx.setLineDash([]);
    ctx.beginPath(); ctx.moveTo(lx, ly - 3); ctx.lineTo(lx + 22, ly - 3); ctx.stroke();
    ctx.restore();
    ctx.fillStyle = '#6E6E6A'; ctx.globalAlpha = 1;
    ctx.fillText(`${paths.length} simulation paths`, lx + 26, ly);

  }, [data]);

  return <canvas ref={canvasRef} style={{ width: '100%', height: '100%', display: 'block' }} />;
}

function MonteCarloTab() {
  const [data, setData] = useState(null);
  const [loading, setLoading] = useState(true);
  const volRef = useRef(null);

  useEffect(() => {
    setLoading(true);
    api('/api/monte-carlo?n_simulations=1000&n_days=30').then(r => {
      if (r.status === 'success') setData(r.data);
      setLoading(false);
    });
  }, []);

  useChartJs(volRef, () => {
    if (!data) return {};

function SIRTab() {
  const [data, setData] = React.useState(null);
  const [loading, setLoading] = React.useState(true);
  const sirCanvasRef = React.useRef(null);
  const velCanvasRef = React.useRef(null);

  React.useEffect(() => {
    setLoading(true);
    api('/api/fraud-sir').then(r => {
      if (r.status === 'success') setData(r.data);
      setLoading(false);
    });
  }, []);

  // Main SIR chart with phase annotations
  React.useEffect(() => {
    const canvas = sirCanvasRef.current;
    if (!canvas || !data) return;
    const dpr = window.devicePixelRatio || 1;
    const W = canvas.offsetWidth, H = canvas.offsetHeight;
    canvas.width = W * dpr; canvas.height = H * dpr;
    const ctx = canvas.getContext('2d');
    ctx.scale(dpr, dpr);

    const agg = data.aggregate;
    const steps = data.steps;
    const pad = { top: 32, right: 24, bottom: 52, left: 56 };
    const cw = W - pad.left - pad.right;
    const ch = H - pad.top - pad.bottom;

    const allVals = [...agg.S, ...agg.I, ...agg.R];
    const maxY = Math.max(...allVals) * 1.08;
    const minY = 0;

    const xScale = i => pad.left + (i / (steps.length - 1)) * cw;
    const yScale = v => pad.top + ch - ((v - minY) / (maxY - minY)) * ch;

    // Background grid
    ctx.strokeStyle = 'rgba(0,0,0,0.05)';
    ctx.lineWidth = 1;
    for (let i = 0; i <= 5; i++) {
      const y = pad.top + (i / 5) * ch;
      ctx.beginPath(); ctx.moveTo(pad.left, y); ctx.lineTo(pad.left + cw, y); ctx.stroke();
    }
    for (let i = 0; i <= 6; i++) {
      const x = pad.left + (i / 6) * cw;
      ctx.beginPath(); ctx.moveTo(x, pad.top); ctx.lineTo(x, pad.top + ch); ctx.stroke();
    }

    // Phase annotations
    const peakDay = data.peak_day || 10;
    const peakX = xScale(Math.min(peakDay, steps.length-1));
    const phases = [
      { label: 'Endemic', x1: 0, x2: peakX * 0.4, color: 'rgba(239,68,68,0.04)' },
      { label: 'Containment', x1: peakX * 0.4, x2: peakX, color: 'rgba(249,115,22,0.04)' },
      { label: 'Eradication', x1: peakX, x2: cw + pad.left, color: 'rgba(34,197,94,0.04)' },
    ];
    phases.forEach(ph => {
      ctx.fillStyle = ph.color;
      ctx.fillRect(ph.x1, pad.top, ph.x2 - ph.x1, ch);
      ctx.fillStyle = 'rgba(0,0,0,0.2)';
      ctx.font = `600 9px 'IBM Plex Mono',monospace`;
      ctx.textAlign = 'center';
      ctx.fillText(ph.label.toUpperCase(), (ph.x1 + ph.x2) / 2, pad.top + 14);
    });

    // Draw filled areas
    const drawArea = (values, color, alpha) => {
      ctx.beginPath();
      ctx.moveTo(xScale(0), yScale(0));
      values.forEach((v, i) => ctx.lineTo(xScale(i), yScale(v)));
      ctx.lineTo(xScale(values.length - 1), yScale(0));
      ctx.closePath();
      ctx.fillStyle = color.replace(')', `,${alpha})`).replace('rgb', 'rgba');
      ctx.fill();
    };

    drawArea(agg.S, 'rgb(55,48,163)', 0.07);
    drawArea(agg.R, 'rgb(34,197,94)', 0.08);
    drawArea(agg.I, 'rgb(239,68,68)', 0.12);

    // Draw lines
    const drawLine = (values, color, width, dash=[]) => {
      ctx.beginPath();
      ctx.strokeStyle = color; ctx.lineWidth = width;
      ctx.setLineDash(dash);
      values.forEach((v, i) => i === 0 ? ctx.moveTo(xScale(i), yScale(v)) : ctx.lineTo(xScale(i), yScale(v)));
      ctx.stroke(); ctx.setLineDash([]);
    };
    drawLine(agg.S, '#3730A3', 2);
    drawLine(agg.R, '#16A34A', 2);
    drawLine(agg.I, '#EF4444', 2.5);

    // Peak infection marker
    const peakVal = data.peak_infected;
    const pxi = steps.indexOf(peakDay) >= 0 ? steps.indexOf(peakDay) : Math.round((peakDay / steps[steps.length-1]) * (steps.length-1));
    ctx.strokeStyle = '#EF4444';
    ctx.lineWidth = 1.5;
    ctx.setLineDash([4, 3]);
    ctx.beginPath(); ctx.moveTo(xScale(pxi), pad.top); ctx.lineTo(xScale(pxi), pad.top + ch); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = '#EF4444';
    ctx.font = `700 9px 'IBM Plex Mono',monospace`;
    ctx.textAlign = 'left';
    ctx.fillText(`Peak Day ${peakDay}`, xScale(pxi) + 4, pad.top + 22);

    // Y-axis labels
    ctx.fillStyle = '#9E9E9A';
    ctx.font = `9px 'IBM Plex Mono',monospace`;
    ctx.textAlign = 'right';
    for (let i = 0; i <= 4; i++) {
      const v = minY + (i / 4) * maxY;
      ctx.fillText(v > 1000 ? `${(v/1000).toFixed(0)}k` : v.toFixed(0), pad.left - 6, yScale(v) + 3);
    }
    // X-axis labels
    ctx.textAlign = 'center';
    [0, 15, 30, 45, 60].forEach(d => {
      const idx = steps.indexOf(d) >= 0 ? steps.indexOf(d) : Math.round((d / steps[steps.length-1]) * (steps.length-1));
      ctx.fillText(`Day ${d}`, xScale(idx), pad.top + ch + 16);
    });

    // Legend
    const legend = [['S','#3730A3'],['I (Active Fraud)','#EF4444'],['R (Resolved)','#16A34A']];
    legend.forEach(([lbl,c], i) => {
      const lx = pad.left + i * (cw/3);
      ctx.fillStyle = c;
      ctx.fillRect(lx, pad.top + ch + 28, 12, 3);
      ctx.fillStyle = '#6E6E6A';
      ctx.font = `9px 'IBM Plex Mono',monospace`;
      ctx.textAlign = 'left';
      ctx.fillText(lbl, lx + 16, pad.top + ch + 31);
    });
  }, [data]);

  // Epidemic velocity chart (daily new infections)
  React.useEffect(() => {
    const canvas = velCanvasRef.current;
    if (!canvas || !data) return;
    const dpr = window.devicePixelRatio || 1;
    const W = canvas.offsetWidth, H = canvas.offsetHeight;
    canvas.width = W * dpr; canvas.height = H * dpr;
    const ctx = canvas.getContext('2d');
    ctx.scale(dpr, dpr);

    const infected = data.aggregate.I;
    const delta = infected.map((v, i) => i === 0 ? 0 : Math.max(0, v - infected[i-1]));
    const maxD = Math.max(...delta) * 1.1 || 1;
    const pad = { top: 16, right: 16, bottom: 30, left: 48 };
    const cw = W - pad.left - pad.right;
    const ch = H - pad.top - pad.bottom;
    const bw = cw / delta.length;

    // Grid
    ctx.strokeStyle = 'rgba(0,0,0,0.05)'; ctx.lineWidth = 1;
    [0.25,0.5,0.75,1].forEach(r => {
      const y = pad.top + ch - r * ch;
      ctx.beginPath(); ctx.moveTo(pad.left, y); ctx.lineTo(pad.left + cw, y); ctx.stroke();
    });

    // Bars
    delta.forEach((v, i) => {
      const h = (v / maxD) * ch;
      const ratio = v / maxD;
      ctx.fillStyle = ratio > 0.7 ? '#EF4444' : ratio > 0.4 ? '#F97316' : '#6366F1';
      ctx.fillRect(pad.left + i * bw + 1, pad.top + ch - h, bw - 2, h);
    });

    // Labels
    ctx.fillStyle = '#9E9E9A';
    ctx.font = `9px 'IBM Plex Mono',monospace`;
    ctx.textAlign = 'right';
    ctx.fillText(maxD.toFixed(0), pad.left - 4, pad.top + 10);
    ctx.fillText('0', pad.left - 4, pad.top + ch);
    ctx.textAlign = 'center';
    [0, 30, 59].forEach(i => {
      ctx.fillText(`D${data.steps[i] || i}`, pad.left + i * bw + bw/2, pad.top + ch + 14);
    });
    ctx.fillStyle = '#6E6E6A';
    ctx.font = `700 9px 'IBM Plex Mono',monospace`;
    ctx.textAlign = 'left';
    ctx.fillText('Daily New Fraud Events', pad.left, pad.top - 2);
  }, [data]);

  if (loading) return <div className="loading-spinner-lg"><span className="spinner" />Running SIR simulation…</div>;
  if (!data) return <div style={{color:'var(--red)', padding:'1rem'}}>Failed to load SIR data.</div>;

  const maxR0 = Math.max(...Object.values(data.channel_r0));

  return (
    <div>
      <div className="stat-grid">
        {[
          ['Overall R₀', data.overall_r0.toFixed(3), data.overall_r0 < 1 ? '🟢 Fraud contained' : '🔴 Spreading'],
          ['Peak Infected', data.peak_infected.toLocaleString(), `Peaks Day ${data.peak_day}`],
          ['Total Population', data.total_population.toLocaleString(), 'Across all channels'],
          ['Containment Rate', `${(data.containment_ratio*100).toFixed(1)}%`, 'Eradicated by Day 60'],
        ].map(([lbl, val, sub]) => (
          <div className="stat-card" key={lbl}>
            <div className="stat-card-val" style={{fontSize:'1.1rem'}}>{val}</div>
            <div className="stat-card-lbl">{lbl}</div>
            <div className="stat-card-sub">{sub}</div>
          </div>
        ))}
      </div>

      <div className="chart-wrap" style={{padding:'1rem 1rem 0.5rem'}}>
        <div className="chart-title">
          <span>Fraud Contagion Dynamics — SIR Epidemiological Model (60-Day Horizon)</span>
          <span style={{color:'var(--subtle)', fontWeight:400, fontSize:'0.58rem'}}>Ref: MDPI Math 2021 · doi:10.3390/math9151781</span>
        </div>
        <div style={{height: 300, position:'relative'}}>
          <canvas ref={sirCanvasRef} style={{width:'100%', height:'100%'}} />
        </div>
      </div>

      <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:'0.85rem', marginTop:'0.85rem'}}>
        <div className="chart-wrap" style={{padding:'1rem 1rem 0.5rem'}}>
          <div className="chart-title"><span>Epidemic Velocity — Daily New Fraud Events</span></div>
          <div style={{height:120, position:'relative'}}>
            <canvas ref={velCanvasRef} style={{width:'100%', height:'100%'}} />
          </div>
        </div>
        <div className="chart-wrap">
          <div className="chart-title">
            <span>R₀ per Payment Channel</span>
            <span style={{color:'var(--subtle)',fontWeight:400}}>{'< 1 = contained · > 1 = spreading'}</span>
          </div>
          {Object.entries(data.channel_r0).map(([ch, r0]) => (
            <div className="channel-bar-row" key={ch}>
              <div className="channel-bar-label">{ch}</div>
              <div style={{flex:1, position:'relative', height:10}}>
                <div style={{position:'absolute',left:0,top:'50%',transform:'translateY(-50%)',width:'100%',height:2,background:'rgba(0,0,0,0.08)',borderRadius:2}}/>
                {r0 >= 1 && <div style={{position:'absolute',left:`${(1/maxR0)*100}%`,top:0,bottom:0,width:2,background:'#EF4444',borderRadius:1,zIndex:2}}/>}
                <div className="channel-bar-track" style={{height:10}}>
                  <div className="channel-bar-fill" style={{ width: `${(r0/Math.max(maxR0,1)*100).toFixed(1)}%`, background: r0 > 1 ? 'linear-gradient(90deg,#F97316,#EF4444)' : 'linear-gradient(90deg,#4F46E5,#6366F1)' }} />
                </div>
              </div>
              <div className="channel-bar-val" style={{color: r0 > 1 ? 'var(--red)' : 'var(--ink)'}}>{r0.toFixed(3)}</div>
            </div>
          ))}
          <div style={{marginTop:'0.6rem', paddingTop:'0.5rem', borderTop:'1px solid var(--border)', fontSize:'0.6rem', color:'var(--subtle)', fontFamily:"'IBM Plex Mono',monospace"}}>
            R₀ &lt; 1 threshold line shown in red where applicable
          </div>
        </div>
      </div>
    </div>
  );
}

          x: { title: { display: true, text: 'Mean Predicted Probability', font: { size: 9 } }, grid: { color: 'rgba(0,0,0,0.04)' }, ticks: { font: { size: 9, family: 'IBM Plex Mono' } } },
          y: { title: { display: true, text: 'Fraction of Positives (Observed Fraud Rate)', font: { size: 9 } }, grid: { color: 'rgba(0,0,0,0.04)' }, ticks: { font: { size: 9, family: 'IBM Plex Mono' }, callback: v => `${(v*100).toFixed(0)}%` } },

            <div style={{flex:1, fontSize:'0.62rem', color:'var(--muted)'}}>Gap: <span className={`pill ${cal.calibration_gap < 0.5 ? 'pill-ok' : cal.calibration_gap < 2 ? 'pill-warn' : 'pill-err'}`}>{cal.calibration_gap}%</span></div>

  useEffect(() => {
    fetchPipeline();
    const iv = setInterval(fetchPipeline, 4000);
    return () => clearInterval(iv);
  }, []);

  const stageClass = s => ({'anchored':'stage-anchored','batched':'stage-batched','hashed':'stage-hashed'}[s] || 'stage-processed');
  const decisionColor = d => d === 'retry' ? '#4F46E5' : d === 'block' ? '#EF4444' : d === 'escalate' ? '#F59E0B' : '#22C55E';

  if (loading) return <div className="loading-spinner-lg"><span className="spinner" />Fetching pipeline…</div>;

  return (
    <div>

              <div style={{fontSize:'0.65rem', fontWeight:600, color: decisionColor(item.decision)}}>{item.decision || '—'}</div>

            </div>
            <div style={{width:80, textAlign:'right'}}>
              {item.is_anomaly ? <span className="pill pill-err">ANOMALY</span> : <span className="pill pill-ok">CLEAR</span>}
            </div>
            <div style={{width:110, textAlign:'right', fontSize:'0.6rem', fontFamily:'IBM Plex Mono', color:'var(--subtle)'}}>
              {item.sha256_short ? `sha256:${item.sha256_short}…` : '—'}

              <a href={item.explorer_url} target="_blank" rel="noopener" className="pill pill-ok" style={{textDecoration:'none', fontSize:'0.55rem'}}>⛓ Chain</a>
            )}
          </div>
        ))}
      </div>
    </div>
  );
}

// ── Main App ───────────────────────────────────────────────────────────────────
function App() {
  const [selectedId, setSelectedId]       = useState(null);
  const [conversations, setConversations] = useState({});
  const [inputVal, setInputVal]           = useState('');
  const [loading, setLoading]             = useState(false);
  const [auditRecord, setAuditRecord]     = useState(null);
  const [stats, setStats]                 = useState(null);
  const [showAnalytics, setShowAnalytics] = useState(false);
  const [tamperResults, setTamperResults] = useState(null);
  const [tamperRunning, setTamperRunning] = useState(false);
  const [tamperPhase, setTamperPhase]     = useState(null); // 'corrupting' | 'verifying' | 'done'
  const [simRunning, setSimRunning]       = useState(false);
  const [showAddTx, setShowAddTx]         = useState(false);
  const [liveSimOn, setLiveSimOn]         = useState(false);
  const liveSimRef = useRef(null);
  const msgsEndRef = useRef(null);

  const selectedEvent = EVENTS.find(e => e.id === selectedId);
  const currentMsgs   = conversations[selectedId] || [];

  const fetchStats = () => api('/api/stats').then(r => { if (r.status === 'success') setStats(r.data); });

  // Scroll chat to bottom
  useEffect(() => {
    msgsEndRef.current?.scrollIntoView({ behavior: 'smooth' });
  }, [currentMsgs, loading]);

  // Live stats polling
  useEffect(() => {
    fetchStats();
    const iv = setInterval(fetchStats, 8000);
    return () => clearInterval(iv);
  }, []);

  const addMessages = (eventId, ...msgs) => {
    setConversations(prev => ({ ...prev, [eventId]: [...(prev[eventId] || []), ...msgs] }));
  };

  const callAgent = async (eventId, message, isFirst) => {
    const event = EVENTS.find(e => e.id === eventId);
    if (!event) return;
    setLoading(true);
    const history = (conversations[eventId] || []).map(m => ({ role: m.role, content: m.content }));
    const res = await post('/api/agent', {
      message:    isFirst ? '' : message,
      event_type: event.type,
      event_data: event.event_data,
      history:    history,
      event_id:   eventId,
    });
    setLoading(false);
    if (res.status === 'success') {
      const agentMsg = {
        id: Date.now() + Math.random(),
        role: 'assistant',
        content: res.message || '—',
        card_type: res.card_type || null,
        card_data: res.card_data || null,
      };
      addMessages(eventId, agentMsg);
      if (res.audit_record && res.audit_record.record_id) {
        setAuditRecord(res.audit_record);
      }
    }
  };

  const selectEvent = async (eventId) => {
    setSelectedId(eventId);
    setInputVal('');
    // If first time opening this event, auto-trigger the agent
    if (!conversations[eventId] || conversations[eventId].length === 0) {
      await callAgent(eventId, '', true);
    }
  };

  const sendMessage = async () => {
    const msg = inputVal.trim();
    if (!msg || loading) return;
    setInputVal('');

    // Intent detection: tamper test trigger from chat
    if (/tamper|corrupt|hash|blockchain proof|verify|sha.?256/i.test(msg)) {
      let eventId = selectedId;
      if (!eventId) {
        const tempId = 'tamper_chat_' + Date.now();
        EVENTS.push({ id: tempId, type: 'finance_question', dot: 'red', title: 'Tamper Demo', meta: msg.substring(0,40), time: 'now', event_data: { question: msg } });
        setSelectedId(tempId);
      }
      addMessages(selectedId || ('tamper_chat_' + Date.now()), { id: Date.now(), role: 'user', content: msg });
      addMessages(selectedId || ('tamper_chat_' + Date.now()), { id: Date.now()+1, role: 'assistant', content: '🔐 Running tamper detection demo — corrupting 5 records and verifying blockchain seal...' });
      await runTamperDemo();
      return;
    }

    // If no event selected, treat as finance question
    let eventId = selectedId;
    if (!eventId) {
      const tempId = 'freeform_' + Date.now();
      const tempEvent = {
        id: tempId, type: 'finance_question', dot: 'blue',
        title: 'Question', meta: msg.substring(0, 40), time: 'now',
        event_data: { question: msg }
      };
      EVENTS.push(tempEvent);
      setSelectedId(tempId);
      addMessages(tempId, { id: Date.now(), role: 'user', content: msg });
      setLoading(true);
      const res = await post('/api/agent', {
        message: '', event_type: 'finance_question',
        event_data: { question: msg }, history: [], event_id: tempId,
      });
      setLoading(false);
      if (res.status === 'success') {
        addMessages(tempId, { id: Date.now() + 1, role: 'assistant', content: res.message || '—', card_type: null, card_data: null });
        if (res.audit_record?.record_id) setAuditRecord(res.audit_record);
      }
      return;
    }
    addMessages(eventId, { id: Date.now(), role: 'user', content: msg });
    await callAgent(eventId, msg, false);
  };

  const runTamperDemo = async () => {
    if (tamperRunning) return;
    setTamperRunning(true);
    setTamperPhase('corrupting');
    setTamperResults({ phase: 'corrupting' });

    // Step 1: corrupt
    const res = await post('/api/demo/tamper', { n: 5 });
    if (res.status !== 'success') {
      setTamperRunning(false);
      setTamperPhase(null);
      setTamperResults({ error: res.detail || 'Tamper failed' });
      return;
    }

    // Step 2: suspense pause — let the "5 records corrupted" sink in
    setTamperPhase('verifying');
    await new Promise(r => setTimeout(r, 1800));

    // Step 3: verify
    const verifyRes = await api('/api/demo/verify-results');
    setTamperRunning(false);
    setTamperPhase('done');
    setTamperResults({
      phase: 'done',
      summary: res.message,
      records: verifyRes.records || [],
      total:    verifyRes.total    || 0,
      verified: verifyRes.verified || 0,
      failed:   verifyRes.failed   || 0,
    });
    fetchStats();
  };

  // Simulate a random payment failure through the REAL pipeline
  const runSimulateFailure = async () => {
    if (simRunning) return;
    setSimRunning(true);
    const names    = ['Arjun Sharma','Meera Pillai','Rohan Das','Kavya Nair','Priya Sharma','Siddharth Rao'];
    const channels = ['upi','card','netbanking','wallet'];
    const types    = ['insufficient_funds','auth_3ds_failure','gateway_timeout','fraud_flag'];
    const dotMap   = { fraud_flag:'red', auth_3ds_failure:'blue', gateway_timeout:'orange', insufficient_funds:'amber' };
    const name = names[Math.floor(Math.random()*names.length)];
    const amt  = Math.floor(Math.random()*48000)+500;
    const ch   = channels[Math.floor(Math.random()*channels.length)];
    const ft   = types[Math.floor(Math.random()*types.length)];
    const newId = 'sim_' + Date.now();
    const txn = {
      transaction_id: newId, customer_name: name, product_name: 'Live Order',
      amount: amt, channel: ch, decline_code: ft.toUpperCase(),
      hour_of_day: new Date().getHours(), day_of_week: new Date().getDay(),
      is_weekend: [0,6].includes(new Date().getDay()),
      retry_count_so_far: 0, customer_txn_history_len: Math.floor(Math.random()*100)+10,
      amount_vs_customer_avg_ratio: +(Math.random()*3+0.5).toFixed(2),
      time_since_last_failure_hours: +(Math.random()*48).toFixed(1),
      merchant_category: 'ecommerce', merchant_name: 'TechGadgets.in'
    };
    // Call the real process endpoint
    const res = await post('/api/process', { transaction: txn });
    setSimRunning(false);
    const newEv = {
      id: newId, type: 'payment_failed', dot: dotMap[ft] || 'red',
      title: ft.replace(/_/g,' '), meta: `${name} · ₹${amt.toLocaleString('en-IN')}`,
      time: 'just now',
      event_data: { transaction: txn }
    };
    EVENTS.unshift(newEv);
    fetchStats();
    await selectEvent(newId);
  };

  const runKaggleReset = async () => {
    setLoading(true);
    const res = await post('/api/demo/reset', {});
    setLoading(false);
    if (res.status === 'success') {
      alert("Reset complete: " + res.message + " Refreshing stats...");
      fetchStats();
    } else {
      alert("Error: " + (res.detail || 'Failed'));
    }
  };

  const toggleLiveSim = () => {
    if (liveSimOn) {
      clearInterval(liveSimRef.current);
      setLiveSimOn(false);
      return;
    }
    setLiveSimOn(true);
    const names = ['Arjun Sharma','Meera Pillai','Rohan Das','Kavya Nair','Siddharth Rao','Ananya Bose'];
    const channels = ['upi','card','netbanking','wallet'];
    const types = ['insufficient_funds','auth_3ds_failure','gateway_timeout','fraud_flag'];
    const dotMap = { fraud_flag:'red', auth_3ds_failure:'blue', gateway_timeout:'orange', insufficient_funds:'amber' };
    liveSimRef.current = setInterval(async () => {
      const name = names[Math.floor(Math.random()*names.length)];
      const amt = Math.floor(Math.random()*45000)+500;
      const ch = channels[Math.floor(Math.random()*channels.length)];
      const ft = types[Math.floor(Math.random()*types.length)];
      const newId = 'live_' + Date.now();
      const newEv = {
        id: newId, type: 'payment_failed', dot: dotMap[ft] || 'red',
        title: ft.replace(/_/g,' '), meta: `${name} · ₹${amt.toLocaleString('en-IN')}`, time: 'just now',
        event_data: { transaction: { transaction_id: newId, customer_name: name, product_name: 'Live Order', amount: amt, channel: ch, decline_code: ft.toUpperCase(), hour_of_day: new Date().getHours(), day_of_week: new Date().getDay(), is_weekend: [0,6].includes(new Date().getDay()), retry_count_so_far: 0, customer_txn_history_len: Math.floor(Math.random()*100), amount_vs_customer_avg_ratio: +(Math.random()*4).toFixed(2), time_since_last_failure_hours: 0, merchant_category: 'ecommerce', merchant_name: 'TechGadgets.in' } }
      };
      EVENTS.unshift(newEv);
      // Force re-render by touching state
      setStats(s => s ? {...s} : s);
    }, 8000);
  };

  const handleAddTransaction = async (form) => {
    const newId = 'custom_' + Date.now();
    const dotMap = { fraud_flag:'red', auth_3ds_failure:'blue', gateway_timeout:'orange', insufficient_funds:'amber' };
    const newEv = {
      id: newId, type: 'payment_failed', dot: dotMap[form.failure_type] || 'red',
      title: form.failure_type.replace(/_/g,' '), meta: `${form.customer_name} · ₹${Number(form.amount).toLocaleString('en-IN')}`, time: 'just now',
      event_data: { transaction: { transaction_id: newId, customer_name: form.customer_name, product_name: 'Custom Order', amount: Number(form.amount), channel: form.channel, decline_code: form.failure_type.toUpperCase(), hour_of_day: new Date().getHours(), day_of_week: new Date().getDay(), is_weekend: [0,6].includes(new Date().getDay()), retry_count_so_far: 0, customer_txn_history_len: 25, amount_vs_customer_avg_ratio: 1.2, time_since_last_failure_hours: 0, merchant_category: 'ecommerce', merchant_name: 'TechGadgets.in' } }
    };
    EVENTS.unshift(newEv);
    setShowAddTx(false);
    // Auto-select and trigger the agent
    await selectEvent(newId);
  };


  // Count unread-ish events by type
  const failedCount   = EVENTS.filter(e => e.type === 'payment_failed').length;
  const alertCount    = EVENTS.filter(e => e.type === 'anomaly_alert').length;
  const chargebackCount = EVENTS.filter(e => e.type === 'chargeback').length;

  const eventsBySection = [
    { label: `${failedCount} failed payments`, types: ['payment_failed'] },
    { label: `${alertCount} risk alerts`, types: ['anomaly_alert'] },
    { label: `${chargebackCount} chargebacks`, types: ['chargeback'] },
    { label: 'Financial insights', types: ['finance_question'] },
  ];

  const handleKeyDown = e => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  };

  return (
    <div className="shell">
      {showAnalytics && <AnalyticsPanel onClose={() => setShowAnalytics(false)} />}

      {/* ── Tamper Result Modal ── */}
      {tamperResults && (
        <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.6)',zIndex:200,display:'flex',alignItems:'center',justifyContent:'center',animation:'fadeIn 0.2s ease'}}>
          <div style={{background:'var(--paper)',border:'2px solid var(--ink)',width:'min(680px,92vw)',maxHeight:'86vh',display:'flex',flexDirection:'column',boxShadow:'8px 8px 0 var(--ink)',animation:'slideUp 0.35s cubic-bezier(0.16,1,0.3,1)'}}>

            {/* Modal header */}
            <div style={{padding:'1rem 1.25rem',borderBottom:'2px solid var(--ink)',display:'flex',alignItems:'center',justifyContent:'space-between',background:'var(--ink)',color:'var(--paper)'}}>
              <div>
                <div style={{fontFamily:"'IBM Plex Mono',monospace",fontSize:'0.75rem',fontWeight:700,textTransform:'uppercase',letterSpacing:'0.12em'}}>Tamper Detection Proof</div>
                <div style={{fontSize:'0.6rem',color:'rgba(241,241,238,0.55)',marginTop:'0.2rem',fontFamily:"'IBM Plex Mono',monospace",letterSpacing:'0.06em'}}>
                  {tamperResults.phase === 'corrupting' && '⚠ Corrupting 5 records in DB…'}
                  {tamperResults.phase === 'verifying'  && '🔍 Running SHA-256 verification…'}
                  {tamperResults.phase === 'done' && `${tamperResults.total} records checked · ${tamperResults.verified} VERIFIED · ${tamperResults.failed} HASH_MISMATCH`}
                  {tamperResults.error && 'ERROR'}
                </div>
              </div>
              {tamperResults.phase === 'done' || tamperResults.error ? (
                <button onClick={() => { setTamperResults(null); setTamperPhase(null); }} style={{background:'none',border:'2px solid rgba(241,241,238,0.3)',width:28,height:28,cursor:'pointer',fontSize:'0.9rem',color:'rgba(241,241,238,0.7)',display:'flex',alignItems:'center',justifyContent:'center',transition:'border-color 0.2s'}} onMouseEnter={e=>e.target.style.borderColor='rgba(241,241,238,0.8)'} onMouseLeave={e=>e.target.style.borderColor='rgba(241,241,238,0.3)'}>✕</button>
              ) : <div style={{width:20,height:20,border:'2px solid rgba(241,241,238,0.2)',borderTopColor:'var(--hot)',animation:'spin 0.7s linear infinite'}} />}
            </div>

            {/* Phase: corrupting */}
            {(tamperResults.phase === 'corrupting' || tamperResults.phase === 'verifying') && (
              <div style={{padding:'2.5rem 1.5rem',display:'flex',flexDirection:'column',alignItems:'center',gap:'1.25rem'}}>
                <div style={{fontFamily:"'IBM Plex Mono',monospace",fontSize:'0.72rem',color:'var(--muted)',letterSpacing:'0.06em'}}>
                  {tamperResults.phase === 'corrupting'
                    ? '⚠ Silently writing corrupted hashes to 5 records…'
                    : '🔐 Verifying SHA-256 seal against blockchain anchor…'}
                </div>
                <div style={{display:'flex',gap:'6px'}}>
                  {[0,1,2,3,4].map(i => (
                    <div key={i} style={{width:10,height:10,background:tamperResults.phase==='verifying'?'var(--hot)':'var(--ink)',animation:`bounce 1.2s ease-in-out ${i*0.15}s infinite`}} />
                  ))}
                </div>
                {tamperResults.phase === 'verifying' && (
                  <div style={{fontSize:'0.65rem',color:'var(--muted)',maxWidth:'360px',textAlign:'center',lineHeight:1.6}}>
                    5 records were corrupted. The SHA-256 verifier is now checking each hash against the anchored Merkle root.
                  </div>
                )}
              </div>
            )}

            {/* Phase: done */}
            {tamperResults.phase === 'done' && !tamperResults.error && (
              <>
                {/* Stats row */}
                <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',borderBottom:'2px solid var(--ink)'}}>
                  {[
                    [tamperResults.total,   'Records checked', null],
                    [tamperResults.verified, 'Verified ✓',    'var(--green)'],
                    [tamperResults.failed,   'HASH_MISMATCH ✗','var(--hot)'],
                  ].map(([v,l,c],idx) => (
                    <div key={l} style={{padding:'1rem 1.1rem',borderRight:idx<2?'2px solid var(--ink)':'none',background:c==='var(--hot)'?'var(--hot-bg)':c==='var(--green)'?'var(--green-bg)':'var(--paper)'}}>

                      <div style={{fontSize:'0.58rem',fontWeight:700,letterSpacing:'0.1em',textTransform:'uppercase',color:'var(--muted)',marginTop:'0.4rem'}}>{l}</div>
                    </div>

                </div>

                {/* Record list with staggered animation */}
                <div style={{flex:1,overflowY:'auto',padding:'0.75rem 1.25rem'}}>
                  {(tamperResults.records || []).map((r,i) => (
                    <div key={i} style={{
                      display:'flex',alignItems:'center',gap:'0.75rem',
                      padding:'0.55rem 0.75rem',marginBottom:'3px',
                      border:'2px solid',
                      borderColor:r.status==='HASH_MISMATCH'?'var(--hot-bd)':'var(--line-soft,#d2d2cc)',
                      background:r.status==='HASH_MISMATCH'?'var(--hot-bg)':'transparent',
                      opacity:0, transform:'translateX(-8px)',
                      animation:`slideInRow 0.4s cubic-bezier(0.16,1,0.3,1) ${i*120}ms forwards`
                    }}>
                      <span style={{fontSize:'0.9rem',flexShrink:0}}>{r.status==='HASH_MISMATCH'?'✗':'✓'}</span>
                      <span style={{fontFamily:"'IBM Plex Mono',monospace",fontSize:'0.6rem',color:'var(--muted)',flex:1,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{r.record_id?.substring(0,28)}…</span>
                      <span style={{fontFamily:"'IBM Plex Mono',monospace",fontSize:'0.62rem',color:r.status==='HASH_MISMATCH'?'var(--hot)':'var(--green)',fontWeight:700,flexShrink:0}}>{r.status}</span>
                      {r.status==='HASH_MISMATCH' && <span style={{fontSize:'0.58rem',color:'var(--hot)',opacity:0.75,flexShrink:0}}>altered post-anchor</span>}
                    </div>

                {/* Footer note */}
                <div style={{padding:'0.75rem 1.25rem',borderTop:'2px solid var(--ink)',background:'var(--ink)',fontSize:'0.65rem',color:'rgba(241,241,238,0.6)',fontFamily:"'IBM Plex Mono',monospace",letterSpacing:'0.04em',lineHeight:1.6}}>
                  SHA-256 is deterministic. Every altered byte changes the hash. 100% catch rate — structural, not tuned.
                </div>
              </>
            )}

            {tamperResults.error && (
              <div style={{padding:'1.5rem',color:'var(--red)',fontFamily:"'IBM Plex Mono',monospace",fontSize:'0.75rem'}}>{tamperResults.error}</div>
            )}
          </div>
        </div>
      )}

      {/* ── Add Transaction Modal ── */}
      {showAddTx && <AddTransactionModal onClose={() => setShowAddTx(false)} onSubmit={handleAddTransaction} />}

      {/* ── Header ── */}
      <header className="header">
        <div style={{ display: 'flex', alignItems: 'center', gap: '1rem' }}>
          <a href="/" style={{ textDecoration: 'none', fontFamily: "'IBM Plex Mono', monospace", fontWeight: 700, textTransform: 'uppercase', letterSpacing: '0.13em', color: 'var(--ink)' }}>
            ATTEST
          </a>
          <div style={{ fontSize: '0.62rem', letterSpacing: '0.07em', textTransform: 'uppercase', color: 'var(--muted)', borderLeft: '1px solid var(--border)', paddingLeft: '0.85rem' }}>
            AI Payment Intelligence
          </div>
          {/* Blockchain simulation mode badge */}
          {stats && stats.batches_anchored === 0 && (
            <div style={{display:'flex',alignItems:'center',gap:'5px',padding:'2px 8px',border:'1px solid var(--amber-bd)',background:'var(--amber-bg)',fontSize:'0.55rem',fontFamily:"'IBM Plex Mono',monospace",fontWeight:700,letterSpacing:'0.08em',textTransform:'uppercase',color:'var(--amber)'}} title="Blockchain writes are simulated — Polygon Amoy testnet requires a funded wallet">
              ⬡ POLYGON AMOY · SIM
            </div>
          )}
          {stats && stats.batches_anchored > 0 && (
            <div style={{display:'flex',alignItems:'center',gap:'5px',padding:'2px 8px',border:'1px solid var(--green-bd)',background:'var(--green-bg)',fontSize:'0.55rem',fontFamily:"'IBM Plex Mono',monospace",fontWeight:700,letterSpacing:'0.08em',textTransform:'uppercase',color:'var(--green)'}}>
              ⬡ POLYGON AMOY · LIVE
            </div>
          )}
        </div>
          <div style={{ display: 'flex', alignItems: 'center', gap: '1.5rem' }}>
            <button
              onClick={() => setShowAnalytics(true)}
              style={{ background:'var(--accent)', color:'#fff', border:'none', borderRadius:'3px', padding:'0.3rem 0.7rem', fontSize:'0.68rem', fontWeight:600, cursor:'pointer', fontFamily:'IBM Plex Mono', letterSpacing:'0.04em', display:'flex', alignItems:'center', gap:'0.3rem' }}
            >
              ⬡ Analytics
            </button>
          {stats && (
            <>
              {[
                [stats.total, 'Decisions'],
                [(stats.verified || 0) + '/' + stats.total, 'Verified'],
                [stats.anomalies || 0, 'Risk flags'],
              ].map(([v, l]) => (
                <div key={l} style={{ textAlign: 'right' }}>
                  <div style={{ fontFamily: "'IBM Plex Mono',monospace", fontSize: '0.88rem', fontWeight: 500 }}>{v}</div>
                  <div style={{ fontSize: '0.57rem', fontWeight: 600, letterSpacing: '0.09em', textTransform: 'uppercase', color: 'var(--subtle)' }}>{l}</div>
                </div>
              ))}
            </>
          )}
          <div style={{ display: 'flex', alignItems: 'center', gap: '0.35rem' }}>
            <span className="pulse-dot" />
            <span className="mono" style={{ fontSize: '0.62rem', color: 'var(--muted)' }}>LIVE</span>
          </div>
        </div>
      </header>

      {/* ── Workspace ── */}
      <div className="workspace">
        {/* Left: Events feed */}
        <aside className="events-panel">
          <div className="events-header">
            <span className="events-title">Activity</span>
            <div style={{display:'flex',gap:'0.4rem',alignItems:'center'}}>
              <button
                onClick={() => setShowAddTx(true)}
                style={{fontSize:'0.6rem',fontWeight:700,background:'var(--accent)',color:'#fff',border:'none',borderRadius:2,padding:'0.15rem 0.4rem',cursor:'pointer',fontFamily:"'IBM Plex Mono',monospace"}}
                title="Add a custom payment event"
              >+ Add</button>
              <button
                onClick={toggleLiveSim}
                style={{fontSize:'0.6rem',fontWeight:700,background:liveSimOn?'#DC2626':'#E4E4E2',color:liveSimOn?'#fff':'var(--muted)',border:'none',borderRadius:2,padding:'0.15rem 0.4rem',cursor:'pointer',fontFamily:"'IBM Plex Mono',monospace"}}
                title={liveSimOn ? 'Stop live simulation' : 'Start live simulation — new events every 8s'}
              >{liveSimOn ? '■ Stop' : '▶ Sim'}</button>
            </div>
          </div>
          <div className="events-list">
            {eventsBySection.map(section => {
              const sectionEvents = EVENTS.filter(e => section.types.includes(e.type) && e.id.startsWith('e'));
              if (!sectionEvents.length) return null;
              return (
                <div key={section.label}>
                  <div className="event-section-label">{section.label}</div>
                  {sectionEvents.map(ev => (
                    <div
                      key={ev.id}
                      className={`event-item ${selectedId === ev.id ? 'active' : ''}`}
                      onClick={() => selectEvent(ev.id)}
                    >
                      <div className={`event-dot dot-${ev.dot}`} />
                      <div className="event-body">
                        <div className="event-title">{ev.title}</div>
                        <div className="event-meta">{ev.meta}</div>
                        <div className="event-time">{ev.time}</div>
                      </div>
                    </div>
                  ))}
                </div>
              );
            })}
            
            <div className="event-section-label" style={{ marginTop: '0.5rem', borderTop: '1px solid var(--border)', paddingTop: '0.8rem' }}>Risk Intelligence</div>
            
            <div className="event-item" onClick={() => setShowAnalytics(true)} style={{ cursor: 'pointer' }}>
              <div className="event-dot" style={{background:'var(--accent2)', boxShadow:`0 0 0 2px var(--accent-bg)`}} />
              <div className="event-body">
                <div className="event-title">Open Analytics Suite</div>
                <div className="event-meta">Monte Carlo · SIR · Calibration</div>
                <div className="event-time">Live pipeline view</div>
              </div>
            </div>

            <div className="event-section-label" style={{ marginTop: '0.5rem', borderTop: '1px solid var(--border)', paddingTop: '0.8rem' }}>Demo Controls (Phase 12)</div>

            {/* Simulate Real Failure */}
            <div className={`event-item`} onClick={!simRunning ? runSimulateFailure : undefined} style={{ opacity: simRunning ? 0.6 : 1, cursor: simRunning ? 'wait' : 'pointer' }}>
              <div className="event-dot" style={{background: simRunning ? 'var(--amber)' : 'var(--green)', animation: simRunning ? 'pulse 0.8s ease-in-out infinite' : undefined}} />
              <div className="event-body">
                <div className="event-title">{simRunning ? 'Processing…' : 'Simulate Failure'}</div>
                <div className="event-meta">{simRunning ? 'Running through AI pipeline' : 'Real XGBoost + chain anchor'}</div>
                <div className="event-time">Random payment failure</div>
              </div>
            </div>

            {/* Tamper Test */}
            <div className={`event-item`} onClick={!tamperRunning ? runTamperDemo : undefined} style={{ opacity: tamperRunning ? 0.6 : 1, cursor: tamperRunning ? 'wait' : 'pointer' }}>
              <div className="event-dot dot-red" style={tamperRunning ? {animation:'pulse 0.8s ease-in-out infinite'} : {}} />
              <div className="event-body">
                <div className="event-title">{tamperRunning ? 'Running tamper test…' : 'Run Tamper Test'}</div>
                <div className="event-meta">{tamperRunning ? 'Corrupting 5 records…' : 'Silently corrupt 5 records'}</div>
                <div className="event-time">Proves cryptographic seal</div>
              </div>
            </div>

            <div className={`event-item`} onClick={runKaggleReset} style={{ opacity: loading ? 0.5 : 1 }}>
              <div className="event-dot dot-blue" />
              <div className="event-body">
                <div className="event-title">Load Kaggle Data</div>
                <div className="event-meta">Reset DB & re-ingest CSV</div>
                <div className="event-time">Takes ~20 seconds</div>
              </div>
            </div>
            
          </div>
        </aside>

        {/* Center: Chat */}
        <main className="chat-panel">
          <ContextBar event={selectedEvent} />
          <div className="chat-messages">
            {selectedId && currentMsgs.length === 0 && loading && (
              <div className="msg-row">
                <div className="msg-avatar avatar-agent">AI</div>
                <div className="msg-content">
                  <div className="msg-sender">Attest</div>
                  <div className="typing-dot">
                    <span /><span /><span />
                  </div>
                </div>
              </div>
            )}
            {!selectedId && (
              <Welcome onQuickAction={(eventId) => selectEvent(eventId)} />
            )}
            {currentMsgs.map(m => (
              <ChatMessage key={m.id} msg={m} />
            ))}
            {loading && currentMsgs.length > 0 && (
              <div className="msg-row">
                <div className="msg-avatar avatar-agent">AI</div>
                <div className="msg-content">
                  <div className="msg-sender">Attest</div>
                  <div className="typing-dot">
                    <span /><span /><span />
                  </div>
                </div>
              </div>
            )}
            <div ref={msgsEndRef} />
          </div>

          {/* Input */}
          <div className="chat-input-bar">
            <textarea
              className="chat-field"
              rows={1}
              placeholder={selectedId ? 'Reply or ask a follow-up question…' : 'Ask anything — settlement, fraud, recovery…'}
              value={inputVal}
              onChange={e => setInputVal(e.target.value)}
              onKeyDown={handleKeyDown}
              disabled={loading}
            />
            <button className="send-btn" onClick={sendMessage} disabled={!inputVal.trim() || loading}>
              {loading ? <span className="spinner" style={{ borderColor: 'rgba(255,255,255,0.3)', borderTopColor: '#fff' }} /> : 'Send'}
            </button>
          </div>
        </main>

        {/* Right: Audit proof */}
        <AuditPanel record={auditRecord} />
      </div>

      <footer className="footer">
        <span style={{fontFamily:"'IBM Plex Mono',monospace", fontSize:'0.65rem', fontWeight:700, textTransform:'uppercase', letterSpacing:'0.1em'}}>ATTEST</span>
        <span>Razorpay AI Buildathon · 2026</span>
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

<script>
/* Kinetic custom cursor for dashboard */
const kDot  = document.getElementById('k-cursor-dot');
const kRing = document.getElementById('k-cursor-ring');
let kmx = window.innerWidth/2, kmy = window.innerHeight/2;
let krx = kmx, kry = kmy;

document.addEventListener('mousemove', e => { kmx = e.clientX; kmy = e.clientY; });

function animKCursor() {
  kDot.style.left  = kmx + 'px';
  kDot.style.top   = kmy + 'px';
  krx += (kmx - krx) * 0.1;
  kry += (kmy - kry) * 0.1;
  kRing.style.left = krx + 'px';
  kRing.style.top  = kry + 'px';
  requestAnimationFrame(animKCursor);
}
animKCursor();

// Observe DOM for interactive elements (handles React-rendered content)
function attachCursorHover() {
  document.querySelectorAll('button, a, .event-item, .quick-card, .pipeline-item, .stat-card, .story-stat-card').forEach(el => {
    if (el._kCursorAttached) return;
    el._kCursorAttached = true;
    el.addEventListener('mouseenter', () => document.body.classList.add('k-hover'));
    el.addEventListener('mouseleave', () => document.body.classList.remove('k-hover'));
  });
}
// Re-run after React renders
const kObserver = new MutationObserver(() => attachCursorHover());
kObserver.observe(document.getElementById('root'), { childList: true, subtree: true });
attachCursorHover();
</script>
</body>
